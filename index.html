<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="">
        <table>
            <tr>
                <th>Firstname:</th>
                <td>
                    <input type="text" name="fname" placeholder="eg:john" required minlength="5">
                </td>
            </tr>
            <tr>
                <th>Lastname:</th>
                <td>
                    <input type="text" name="lname" placeholder="eg:Doe" required minlength="5">
                </td>
            </tr>
            <tr>
                <th>DOB:</th>
                <td>
                    <input type="date" name="date" required >
                </td>
            </tr>
            <tr>
                <th>Gender:</th>
                <td>
                   <input type="radio" name="Gender" id="">Male
                   <input type="radio" name="Gender" id="">female
                </td>
            </tr>
            <tr>
                <th>Qualification:</th>
                <td>
                    <select name="Qualification" required>
                        <option value="">-- Select --</option>
                      <option value="highschool">HighSchool</option>
                      <option value="diploma">Diploma</option>
                      <option value="bachelors">Bachelor's Degree</option>
                      <option value="masters">Master's Degree</option>
                      <option value="phd">PhD</option>
                  </select>
                </td>
            </tr>
            <tr>
                <th>Address:</th>
                <td>
                    <textarea name="Address" rows="4" cols="30" required></textarea>
                </td>
            </tr>
            <tr>
                <th>State:</th>
                <td>
                    <input type="text" name="state" required minlength="3" >
                </td>
            </tr>
            <tr>
                <th>Pincode:</th>
                <td>
                    <input type="number" name="pincode" placeholder="eg:673639" required maxlength="6">
                </td>
            </tr>
            <tr>
                <th>Email:</th>
                <td>
                    <input type="email" name="email" placeholder="eg:john@gmail.com" required minlength="5" >
                </td>
            </tr>
            <tr>
                <th>Phone:</th>
                <td>
                    <input type="number" name="phone" required max="10" >
                </td>
            </tr>
            <tr>
                <th>Username:</th>
                <td>
                    <input type="text" name="uname" placeholder="eg:johndoe" required minlength="5" maxlength="12" >
                </td>
            </tr>
            <tr>
                <th>Password:</th>
                <td>
                    <input type="password" name="pswd"  required minlength="5" maxlength="15">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                <button>Submit</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
